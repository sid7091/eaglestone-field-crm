name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # prisma.config.ts maps datasource.url to process.env.DATABASE_URL. CI has
    # no .env (it's git-ignored), so without this the value is undefined and
    # `prisma migrate dev` fails with "datasource.url property is required".
    # Job-level so migrate, seed, build and the tests all see it.
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci || npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Setup Database
      run: |
        npm run db:migrate
        # The client is generated into src/generated/prisma, which is
        # git-ignored, so it never exists on a fresh checkout. Without this
        # the seed (and the build) fail with ERR_MODULE_NOT_FOUND.
        npx prisma generate
        npm run db:seed
    - name: Build Next.js App
      run: npm run build
    - name: Run Playwright tests
      run: npm run test:e2e
      env:
        GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
